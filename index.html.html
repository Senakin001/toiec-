let userStats = {};

function loadUserStats() {

    userStats = {};
  }
}

  } catch {}
}

  if (!userStats[word]) {
    userStats[word] = { learned: false, mistakes: 0, bookmarked: false };
  }
  return userStats[word];
}

// Streak Tracking
function getStreakData() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const raw = localStorage.getItem(STREAK_KEY);
    if (!raw) {
      return { streak: 1, lastDate: today, todayCount: 0 };
    }
    const data = JSON.parse(raw);
    if (data.lastDate !== today) {
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const isConsecutive = data.lastDate === yesterday;
      const updated = {
        streak: isConsecutive ? data.streak + 1 : 1,
        lastDate: today,
        todayCount: 0
      };
      localStorage.setItem(STREAK_KEY, JSON.stringify(updated));
      return updated;
    }
    return data;
  } catch {
    return { streak: 1, lastDate: new Date().toISOString().slice(0, 10), todayCount: 0 };
  }
}

function recordLearnedToday() {
  try {
    const data = getStreakData();
    data.todayCount = (data.todayCount || 0) + 1;
    localStorage.setItem(STREAK_KEY, JSON.stringify(data));
    updateStreakUI();
  } catch {}
}

function updateStreakUI() {
  const data = getStreakData();
  const el = document.getElementById('streakDaysText');
  if (el) el.innerText = `${data.streak}日連続`;
}

// Web Audio API Sound Synthesizer
let audioCtx = null;
function getAudioContext() {
  try {
    if (!audioCtx) {
      const AudioClass = window.AudioContext || window.webkitAudioContext;
      if (AudioClass) audioCtx = new AudioClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch {
    return null;
  }
}

function playSuccessChime() {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch {}
}

function playErrorTone() {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(160, ctx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
  } catch {}
}

  showToast(soundEnabled ? '効果音: ON' : '効果音: OFF');

// Category Label Helper
function getCategoryShortLabel(code) {
  if (!code) return '';
  if (code === '600') return '600点';
  if (code === '730') return '730点';
  if (code === '860') return '860点';
  if (code === '990') return '990点';
  if (code.startsWith('extra_')) {
    const sub = code.replace('extra_', '');
    const map = { dept: '部署', job: '職業', major: '専攻', prep: '前置詞', conj: '接続詞', adv: '接続副詞' };
    return map[sub] || '付録';
  }
  if (code.startsWith('idiom_')) {
    const sub = code.replace('idiom_', '');
    const map = { sched: '日程・時間', pv1: '句動詞A', pv2: '句動詞B', vprep: '動詞+前置詞', adjprep: 'be+形容詞', prep: '群前置詞' };
    return map[sub] || '熟語';
  }
  if (code === 'idiom') return '熟語';
  if (code.startsWith('custom')) {
    const sub = code.replace('custom_', '');
    const map = { idiom: '自作熟語', part7: 'Part7頻出', business: 'ビジネス', important: '要注意', other: '自作単語', custom: '自作単語' };
    return map[sub] || '自作単語';
  }
  return code;
}

// Speech Synthesis
function speakWord(rawWord) {
  if (!('speechSynthesis' in window)) {
    showToast('音声再生に非対応の環境です');
    return;
  }
  try {
    const cleanWord = rawWord.split('/')[0].replace(/[\(\)]/g, '').trim();
    window.speechSynthesis.cancel();
    const ut = new SpeechSynthesisUtterance(cleanWord);
    ut.lang = 'en-US';
    ut.rate = 0.95;
    window.speechSynthesis.speak(ut);
  } catch {}
}

function playCurrentAudio() {
  if (currentQueue.length > 0 && currentQueue[currentCardIndex]) {
    speakWord(currentQueue[currentCardIndex][1]);
  }
}

      { id: 'adjprep', label: '💎 be＋形容詞＋前置詞の必須構文 (30項目)' },
      { id: 'prep', label: '🚀 接続詞的に使える重要群前置詞 (30項目)' },
      { id: 'all', label: '⭐ 必須イディオム 全200項目まとめ' }
    ];
  } else if (lvl === 'custom') {
    return [
      { id: 'all_custom', label: `✏️ 登録済みマイトレーニング (${customWords.length}語)` }
    ];
  } else if (lvl === 'weakness') {
    return [{ id: 'all_mistakes', label: '⚠️ ミスした全単語の総特訓' }];
  } else if (lvl === 'bookmarks') {
    return [{ id: 'all_bookmarks', label: '⭐ ブックマーク登録単語' }];
  }
  return [];
}

function getBaseSectionList() {
  const all = getAllWords();
  if (currentLevel === 'weakness') {
    return all.filter(item => getWordData(item[1]).mistakes > 0);
  }
  if (currentLevel === 'bookmarks') {
    return all.filter(item => getWordData(item[1]).bookmarked);
  }
  if (currentLevel === 'custom') {
    return [...customWords];
  }
  if (currentLevel === 'idiom') {
    if (currentPart === 'all') {
      return MASTER_DATA.filter(item => item[0].startsWith('idiom_'));
    }
    return MASTER_DATA.filter(item => item[0] === 'idiom_' + currentPart);
  }
  if (currentLevel !== 'extra') {
    const fullLevelList = MASTER_DATA.filter(item => item[0] === currentLevel);
    if (currentPart === 'all') return fullLevelList;
    const pIndex = parseInt(currentPart, 10);
    return fullLevelList.slice(pIndex * 50, (pIndex + 1) * 50);
  } else {
    if (currentPart === 'all') {
      return MASTER_DATA.filter(item => item[0].startsWith('extra_'));
    }
    return MASTER_DATA.filter(item => item[0] === 'extra_' + currentPart);
  }
}

function refreshQueue() {
  const baseList = getBaseSectionList();
  const totalCount = baseList.length;

  const unlearnedList = baseList.filter(item => !getWordData(item[1]).learned);
  const mistakesList = baseList.filter(item => getWordData(item[1]).mistakes > 0);
  const bookmarkList = baseList.filter(item => getWordData(item[1]).bookmarked);

  document.getElementById('unlearnedQueueCount').innerText = unlearnedList.length;
  document.getElementById('mistakeQueueCount').innerText = mistakesList.length;
  document.getElementById('bookmarkQueueCount').innerText = bookmarkList.length;
  document.getElementById('totalQueueCount').innerText = totalCount;

  if (currentQueueFilter === 'unlearned') {
    currentQueue = [...unlearnedList];
  } else if (currentQueueFilter === 'mistakes') {
    currentQueue = [...mistakesList];
  } else if (currentQueueFilter === 'bookmarked') {
    currentQueue = [...bookmarkList];
  } else {
    currentQueue = [...baseList];
  }

  const learnedCount = totalCount - unlearnedList.length;
  const pct = totalCount > 0 ? Math.round((learnedCount / totalCount) * 100) : 0;
  document.getElementById('sectionProgressText').innerText = `進捗: ${learnedCount} / ${totalCount} (${pct}%)`;
  document.getElementById('sectionProgressBar').style.width = `${pct}%`;

  // Global total progress
  const allWords = getAllWords();
  const totalAll = allWords.length;
  const learnedAll = allWords.filter(item => getWordData(item[1]).learned).length;
  const globalPct = totalAll > 0 ? Math.round((learnedAll / totalAll) * 100) : 0;
  document.getElementById('globalProgressPct').innerText = `${globalPct}%`;

  if (currentCardIndex >= currentQueue.length) {
    currentCardIndex = Math.max(0, currentQueue.length - 1);
  }

  renderCurrentCard();
  renderCurrentSpell();
  if (currentTab === 'list') renderWordList();
  if (currentTab === 'analytics') renderAnalytics();
}

function setQueueFilter(filterType) {
  const baseList = getBaseSectionList();
  if (filterType === 'mistakes') {
    const mistakesCount = baseList.filter(item => getWordData(item[1]).mistakes > 0).length;
    if (mistakesCount === 0) {
      showToast('現在、苦手（ミスした単語）はありません！素晴らしい！🎉');
      return;
    }
  } else if (filterType === 'bookmarked') {
    const bookmarkedCount = baseList.filter(item => getWordData(item[1]).bookmarked).length;
    if (bookmarkedCount === 0) {
      showToast('ブックマーク（⭐）された単語はまだありません');
      return;
    }
  }

  currentQueueFilter = filterType;
  ['unlearned', 'mistakes', 'bookmarked', 'all'].forEach(f => {
    const btn = document.getElementById(`btnFilter${f.charAt(0).toUpperCase() + f.slice(1)}`);
    if (f === filterType) {
      btn.className = 'px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-black shadow-xs transition-all cursor-pointer';
    } else {
      btn.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer';
    }
  });
  refreshQueue();
}

// Card Undo Stack
let cardActionHistory = [];

function handleUndoLastAction() {
  if (cardActionHistory.length === 0) {
    showToast('元に戻す操作履歴がありません');
    return;
  }
  const last = cardActionHistory.pop();
  const wData = getWordData(last.word);
  wData.learned = last.prevLearned;
  wData.mistakes = last.prevMistakes;
  saveUserStats();
  refreshQueue();

  const idx = currentQueue.findIndex(it => it[1] === last.word);
  if (idx !== -1) {
    currentCardIndex = idx;
  }
  renderCurrentCard();
  updateUndoButtonState();
  showToast(`「${last.word}」の判定を取り消しました ↩️`);
}

function updateUndoButtonState() {
  const btn = document.getElementById('btnUndoCard');
  if (btn) {
    if (cardActionHistory.length > 0) {
      btn.disabled = false;
      btn.className = 'flex items-center gap-1.5 py-1.5 px-3 rounded-xl bg-slate-800 border border-amber-500/40 text-xs font-bold text-amber-400 hover:bg-slate-700 cursor-pointer shadow-sm transition-all';
    } else {
      btn.disabled = true;
      btn.className = 'flex items-center gap-1.5 py-1.5 px-3 rounded-xl bg-slate-800/40 border border-slate-800 text-xs font-bold text-slate-600 opacity-40 cursor-not-allowed transition-all';
    }
  }
}

function toggleCardFrontMode() {

function toggleAutoPlay() {
  isAutoPlaying = !isAutoPlaying;
  const btn = document.getElementById('btnAutoPlay');
  if (isAutoPlaying) {
    btn.className = 'flex items-center gap-1 text-[11px] px-2.5 py-0.5 rounded-md font-bold bg-amber-500 text-slate-950 animate-pulse cursor-pointer';

function navigateCard(delta) {
  if (currentQueue.length === 0) return;
  currentCardIndex = (currentCardIndex + delta + currentQueue.length) % currentQueue.length;
  renderCurrentCard();
}

function shuffleCurrentQueue() {
  if (currentQueue.length <= 1) return;
  for (let i = currentQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentQueue[i], currentQueue[j]] = [currentQueue[j], currentQueue[i]];
  }
  currentCardIndex = 0;
  renderCurrentCard();
  showToast('シャッフルしました 🔀');
}

function toggleCurrentBookmark() {
  if (currentQueue.length === 0) return;
  const item = currentQueue[currentCardIndex];
  const wData = getWordData(item[1]);
  wData.bookmarked = !wData.bookmarked;
  saveUserStats();
  renderCurrentCard();
  showToast(wData.bookmarked ? `「${item[1]}」をブックマークしました ⭐` : `「${item[1]}」のブックマークを解除しました`);
}

function handleMarkCard(learned) {
  if (currentQueue.length === 0) return;
  const item = currentQueue[currentCardIndex];
  if (!item) return;
  const wData = getWordData(item[1]);

  cardActionHistory.push({
    word: item[1],
    prevLearned: wData.learned,
    prevMistakes: wData.mistakes || 0
  });
  updateUndoButtonState();

  if (learned) {
    wData.learned = true;
    saveUserStats();
    playSuccessChime();
    recordLearnedToday();
    showToast(`「${item[1]}」を習得済みにしました ✅`);

    if (currentQueueFilter === 'unlearned') {
      currentQueue.splice(currentCardIndex, 1);
      if (currentCardIndex >= currentQueue.length) {
        currentCardIndex = Math.max(0, currentQueue.length - 1);
      }
      refreshQueue();
      return;
    }
  } else {
    wData.mistakes = (wData.mistakes || 0) + 1;
    saveUserStats();
    playErrorTone();
    showToast(`ミス回数を加算しました (累計: ${wData.mistakes}回) ⚠️`);
  }

  navigateCard(1);
  refreshQueue();
}

// 2. 4-CHOICE QUIZ LOGIC
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizActiveQuestion = null;
let quizMistakes = [];
let quizMode = 'en_to_ja'; // 'en_to_ja' | 'ja_to_en' | 'listening'
let quizTimerLimit = 0; // 0 = unlimited
let quizTimerInterval = null;
let quizTimeLeft = 0;

function setQuizMode(mode) {
  quizMode = mode;
  ['en_to_ja', 'ja_to_en', 'listening'].forEach(m => {
    const btn = document.getElementById('qmode_' + m);
    if (m === mode) {
      btn.className = 'py-2 px-2 rounded-xl text-xs font-bold border border-amber-400 bg-amber-500 text-slate-950 shadow-sm text-center cursor-pointer';
    } else {
      btn.className = 'py-2 px-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 text-center cursor-pointer';
    }
  });
}

function setQuizTimer(sec) {
  quizTimerLimit = sec;
  [0, 10, 8, 5].forEach(s => {
    const btn = document.getElementById('qtime_' + s);
    if (s === sec) {
      btn.className = 'py-1.5 rounded-lg text-xs font-black border border-amber-400 bg-amber-500 text-slate-950 text-center cursor-pointer';
    } else {
      btn.className = 'py-1.5 rounded-lg text-xs font-bold border border-slate-700 bg-slate-800 text-slate-400 hover:text-white text-center cursor-pointer';
    }
  });
}

function resetQuizScreen() {
  if (quizTimerInterval) clearInterval(quizTimerInterval);
  document.getElementById('quizIntro').classList.remove('hidden');
  document.getElementById('quizActive').classList.add('hidden');
  document.getElementById('quizResult').classList.add('hidden');
}

function startQuiz(countLimit = 30, customPool = null) {
  const pool = customPool ? [...customPool] : [...getBaseSectionList()];
  if (pool.length === 0) {
    showToast('出題対象の単語がありません');
    return;
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  quizQuestions = countLimit > 0 && countLimit < pool.length ? pool.slice(0, countLimit) : pool;
  quizIndex = 0;
  quizScore = 0;
  quizMistakes = [];

  document.getElementById('quizIntro').classList.add('hidden');
  document.getElementById('quizResult').classList.add('hidden');
  document.getElementById('quizActive').classList.remove('hidden');

  renderQuizQuestion();
}

function renderQuizQuestion() {
  if (quizTimerInterval) clearInterval(quizTimerInterval);
  quizActiveQuestion = quizQuestions[quizIndex];
  const total = quizQuestions.length;

  document.getElementById('quizProgressNum').innerText = `第 ${quizIndex + 1} / ${total} 問`;
  document.getElementById('quizCurrentScore').innerText = `スコア: ${quizScore}`;
  document.getElementById('quizProgressBar').style.width = `${(quizIndex / total) * 100}%`;

  const wordDisplay = document.getElementById('quizWordDisplay');
  const listeningBox = document.getElementById('quizListeningBox');
  const instructionBadge = document.getElementById('quizInstructionBadge');

  if (quizMode === 'listening') {
    instructionBadge.innerText = '音声を聞いて意味を選んでください';
    wordDisplay.classList.add('hidden');
    listeningBox.classList.remove('hidden');
    speakWord(quizActiveQuestion[1]);
  } else if (quizMode === 'ja_to_en') {
    instructionBadge.innerText = '日本語に合う正しい英単語を選んでください';
    wordDisplay.classList.remove('hidden');
    listeningBox.classList.add('hidden');
    wordDisplay.innerText = quizActiveQuestion[2];
  } else {
    instructionBadge.innerText = '英単語に合う正しい日本語訳を選んでください';
    wordDisplay.classList.remove('hidden');
    listeningBox.classList.add('hidden');
    wordDisplay.innerText = quizActiveQuestion[1];
    speakWord(quizActiveQuestion[1]);
  }

  // Timer logic
  const timerBadge = document.getElementById('quizTimerBadge');
  if (quizTimerLimit > 0) {
    quizTimeLeft = quizTimerLimit;
    timerBadge.classList.remove('hidden');
    timerBadge.innerText = `⏱ ${quizTimeLeft}s`;
    quizTimerInterval = setInterval(() => {
      quizTimeLeft--;
      timerBadge.innerText = `⏱ ${quizTimeLeft}s`;
      if (quizTimeLeft <= 0) {
        clearInterval(quizTimerInterval);
        handleQuizTimeout();
      }
    }, 1000);
  } else {
    timerBadge.classList.add('hidden');
  }

  // Generate 4 options
  const isTargetEnglish = quizMode === 'ja_to_en';
  const correctAnswer = isTargetEnglish ? quizActiveQuestion[1] : quizActiveQuestion[2];
  const options = [correctAnswer];
  const pool = getAllWords().filter(item => (isTargetEnglish ? item[1] : item[2]) !== correctAnswer);

  while (options.length < 4 && pool.length > 0) {
    const randItem = pool[Math.floor(Math.random() * pool.length)];
    const optVal = isTargetEnglish ? randItem[1] : randItem[2];
    if (!options.includes(optVal)) options.push(optVal);
  }
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  const container = document.getElementById('quizOptionsContainer');
  container.innerHTML = '';
  options.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'w-full text-left py-3.5 px-4 rounded-2xl border-2 border-slate-700 bg-slate-800 text-slate-200 hover:border-amber-400 font-bold text-sm sm:text-base transition-all flex items-center justify-between group active:scale-[0.99] cursor-pointer';
    btn.innerHTML = `
      <div class="flex items-center gap-3 min-w-0">
        <span class="w-6 h-6 rounded-lg bg-slate-900 text-slate-400 flex items-center justify-center text-xs font-mono shrink-0">${i + 1}</span>
        <span class="truncate">${optText}</span>
      </div>
      <span class="text-xs text-slate-400">➔</span>
    `;
    btn.onclick = () => selectQuizAnswer(optText, correctAnswer, btn);
    container.appendChild(btn);
  });
}

function handleQuizTimeout() {
  const container = document.getElementById('quizOptionsContainer');
  const allButtons = container.querySelectorAll('button');
  allButtons.forEach(b => (b.disabled = true));

  const isTargetEnglish = quizMode === 'ja_to_en';
  const correctAnswer = isTargetEnglish ? quizActiveQuestion[1] : quizActiveQuestion[2];
  const wData = getWordData(quizActiveQuestion[1]);
  wData.mistakes = (wData.mistakes || 0) + 1;
  quizMistakes.push(quizActiveQuestion);
  playErrorTone();

  allButtons.forEach(b => {
    if (b.innerText.includes(correctAnswer)) {
      b.className = 'w-full text-left py-3.5 px-4 rounded-2xl border-2 border-emerald-500 bg-emerald-950/70 text-emerald-200 font-black';
    }
  });
  saveUserStats();
  setTimeout(() => advanceQuiz(), 950);
}

function selectQuizAnswer(selected, correct, selectedBtn) {
  if (quizTimerInterval) clearInterval(quizTimerInterval);
  const allButtons = document.querySelectorAll('#quizOptionsContainer button');
  allButtons.forEach(b => (b.disabled = true));

  const wData = getWordData(quizActiveQuestion[1]);

  if (selected === correct) {
    selectedBtn.className = 'w-full text-left py-3.5 px-4 rounded-2xl border-2 border-emerald-500 bg-emerald-950/70 text-emerald-200 font-black shadow-lg shadow-emerald-500/20';
    quizScore++;
    wData.learned = true;
    playSuccessChime();
    recordLearnedToday();
  } else {
    selectedBtn.className = 'w-full text-left py-3.5 px-4 rounded-2xl border-2 border-rose-500 bg-rose-950/70 text-rose-200 font-bold';
    wData.mistakes = (wData.mistakes || 0) + 1;
    quizMistakes.push(quizActiveQuestion);
    playErrorTone();

    allButtons.forEach(b => {
      if (b.innerText.includes(correct)) {
        b.className = 'w-full text-left py-3.5 px-4 rounded-2xl border-2 border-emerald-500 bg-emerald-950/70 text-emerald-200 font-black';
      }
    });
  }
  saveUserStats();
  setTimeout(() => advanceQuiz(), 950);
}

function advanceQuiz() {
  quizIndex++;
  if (quizIndex < quizQuestions.length) {
    renderQuizQuestion();
  } else {
    showQuizSummary();
  }
}

function playQuizWordAudio() {
  if (quizActiveQuestion) speakWord(quizActiveQuestion[1]);
}

function abandonQuiz() {
  resetQuizScreen();
  showToast('テストを中断しました');
}

function showQuizSummary() {
  if (quizTimerInterval) clearInterval(quizTimerInterval);
  document.getElementById('quizActive').classList.add('hidden');
  document.getElementById('quizResult').classList.remove('hidden');

  const total = quizQuestions.length;
  const rate = total > 0 ? Math.round((quizScore / total) * 100) : 0;
  document.getElementById('quizResultScore').innerHTML = `${quizScore} <span class="text-xl text-slate-500">/ ${total}</span>`;
  document.getElementById('quizAccuracy').innerText = `正答率: ${rate}%`;

  let feedback = '反復を継続してスコアアップを目指しましょう！';
  if (rate === 100) feedback = 'パーフェクト達成！金フレ完全制覇レベルです！🎉';
  else if (rate >= 80) feedback = '素晴らしい実力です！間違えた単語だけ再テストで補強しましょう。';
  else if (rate <= 50) feedback = 'まずはカード暗記で基本単語のキューを消化してみましょう！';
  document.getElementById('quizComment').innerText = feedback;

  const btnRetry = document.getElementById('btnRetryMistakes');
  document.getElementById('quizMistakeCountSpan').innerText = quizMistakes.length;
  const mistakeDetail = document.getElementById('quizMistakesDetail');
  const mistakeList = document.getElementById('quizMistakeList');
  mistakeList.innerHTML = '';

  if (quizMistakes.length > 0) {
    btnRetry.classList.remove('hidden');
    mistakeDetail.classList.remove('hidden');

    quizMistakes.forEach(item => {
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between p-2.5 rounded-xl bg-rose-950/40 border border-rose-900/60';
      row.innerHTML = `
        <div class="min-w-0 pr-2">
          <span class="font-extrabold text-white mr-2">${item[1]}</span>
          <span class="text-slate-400 text-[11px]">${item[2]}</span>
        </div>
        <button onclick="speakWord('${item[1]}')" class="p-1 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-slate-800">🔊</button>
      `;
      mistakeList.appendChild(row);
    });
  } else {
    btnRetry.classList.add('hidden');
    mistakeDetail.classList.add('hidden');
    if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  }

  refreshQueue();
}

function retryQuizMistakes() {
  if (quizMistakes.length === 0) return;
  startQuiz(0, [...quizMistakes]);
  showToast('間違えた問題の特訓を開始します！⚠️');
}

// 3. SPELLING DRILL LOGIC
let spellStreak = 0;
function renderCurrentSpell() {
  const fb = document.getElementById('spellFeedback');
  fb.innerText = '';
  const input = document.getElementById('spellInput');
  input.value = '';

  if (currentQueue.length === 0) {
    document.getElementById('spellCounterText').innerText = '完了 0 / 0';
    document.getElementById('spellMeaningDisplay').innerText = 'すべての単語を習得しました！';
    input.disabled = true;
    return;
  }
  input.disabled = false;
  const item = currentQueue[currentCardIndex];
  document.getElementById('spellCounterText').innerText = `単語 ${currentCardIndex + 1} / ${currentQueue.length}`;
  document.getElementById('spellMeaningDisplay').innerText = item[2];
  document.getElementById('spellStreakCount').innerText = spellStreak;
}

function navigateSpell(delta) {
  if (currentQueue.length === 0) return;
  currentCardIndex = (currentCardIndex + delta + currentQueue.length) % currentQueue.length;
  renderCurrentSpell();
}

function giveSpellHint() {
  if (currentQueue.length === 0) return;
  const word = currentQueue[currentCardIndex][1];
  const cleanWord = word.split('/')[0].replace(/[\(\)]/g, '').trim().toLowerCase();
  const input = document.getElementById('spellInput');
  const curVal = input.value.toLowerCase();
  if (curVal.length < cleanWord.length) {
    input.value = cleanWord.slice(0, curVal.length + 1);
  }
  input.focus();
}

function checkSpelling() {
  if (currentQueue.length === 0) return;
  const item = currentQueue[currentCardIndex];
  const input = document.getElementById('spellInput');
  const entered = input.value.trim().toLowerCase();
  const targetVariants = item[1].toLowerCase().split('/').map(s => s.trim().replace(/[\(\)]/g, ''));
  const fb = document.getElementById('spellFeedback');
  const wData = getWordData(item[1]);

  const isCorrect = targetVariants.some(v => v === entered);

  if (isCorrect) {
    fb.innerHTML = `<span class="text-emerald-400 font-black">⭕ 正解！ Excellent! [${item[1]}]</span>`;
    spellStreak++;
    wData.learned = true;
    saveUserStats();
    playSuccessChime();
    speakWord(item[1]);
    recordLearnedToday();
    setTimeout(() => {
      navigateSpell(1);
      refreshQueue();
    }, 1000);
  } else {
    fb.innerHTML = `<span class="text-rose-400 font-bold">❌ 正解: ${item[1]}</span>`;
    spellStreak = 0;
    wData.mistakes = (wData.mistakes || 0) + 1;
    saveUserStats();
    playErrorTone();
  }
  document.getElementById('spellStreakCount').innerText = spellStreak;
}

// 4. SPEED ATTACK LOGIC (45s)
let speedPlaying = false;
let speedTimeLeft = 45;
let speedTimer = null;
let speedScore = 0;
let speedCombos = 0;
let speedMaxCombo = 0;
let currentSpeedItem = null;

function startSpeedGame() {
  const pool = getBaseSectionList();
  if (pool.length === 0) {
    showToast('出題対象の単語がありません');
    return;
  }
  speedScore = 0;
  speedCombos = 0;
  speedMaxCombo = 0;
  speedTimeLeft = 45;
  speedPlaying = true;

  document.getElementById('speedIntro').classList.add('hidden');
  document.getElementById('speedResult').classList.add('hidden');
  document.getElementById('speedActive').classList.remove('hidden');

  document.getElementById('speedScoreText').innerText = '0';
  document.getElementById('speedTimerText').innerText = '⏱ 45s';
  document.getElementById('speedComboBadge').classList.add('hidden');

  nextSpeedItem();

  if (speedTimer) clearInterval(speedTimer);
  speedTimer = setInterval(() => {
    speedTimeLeft--;
    document.getElementById('speedTimerText').innerText = `⏱ ${speedTimeLeft}s`;
    if (speedTimeLeft <= 0) {
      clearInterval(speedTimer);
      finishSpeedGame();
    }
  }, 1000);
}

function nextSpeedItem() {
  const pool = getBaseSectionList();
  if (pool.length === 0) return;
  const wordItem = pool[Math.floor(Math.random() * pool.length)];
  const isMatch = Math.random() > 0.5;

  let displayedMeaning = wordItem[2];
  if (!isMatch) {
    const others = getAllWords().filter(w => w[2] !== wordItem[2]);
    if (others.length > 0) {
      displayedMeaning = others[Math.floor(Math.random() * others.length)][2];
    }
  }

  currentSpeedItem = { wordItem, displayedMeaning, isMatch };
  document.getElementById('speedWordText').innerText = wordItem[1];
  document.getElementById('speedMeaningText').innerText = displayedMeaning;
}

function handleSpeedAnswer(userGuessedMatch) {
  if (!speedPlaying || !currentSpeedItem) return;

  const correct = userGuessedMatch === currentSpeedItem.isMatch;
  const wData = getWordData(currentSpeedItem.wordItem[1]);

  if (correct) {
    speedScore++;
    speedCombos++;
    if (speedCombos > speedMaxCombo) speedMaxCombo = speedCombos;
    wData.learned = true;
    playSuccessChime();
    recordLearnedToday();

    if (speedCombos > 1) {
      const badge = document.getElementById('speedComboBadge');
      badge.classList.remove('hidden');
      document.getElementById('speedComboCount').innerText = speedCombos;
    }
  } else {
    speedCombos = 0;
    wData.mistakes = (wData.mistakes || 0) + 1;
    document.getElementById('speedComboBadge').classList.add('hidden');
    playErrorTone();
  }
  saveUserStats();
  document.getElementById('speedScoreText').innerText = speedScore;
  nextSpeedItem();
}

function finishSpeedGame() {
  speedPlaying = false;
  document.getElementById('speedActive').classList.add('hidden');
  document.getElementById('speedResult').classList.remove('hidden');

  document.getElementById('speedFinalScore').innerText = speedScore;
  document.getElementById('speedMaxCombo').innerText = speedMaxCombo;

  if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
  refreshQueue();
}

let listLevelFilter = 'all';

function setListLevelFilter(lvl) {

function setListStatusFilter(stat) {

  ['all', 'unlearned', 'learned', 'mistakes', 'bookmarked'].forEach(s => {
    const btn = document.getElementById('btnListStat_' + s);

      ? 'px-2 py-1 rounded-lg font-bold text-[11px] bg-slate-200 text-slate-950 font-black cursor-pointer'

  });

}

function renderWordList() {
  const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const container = document.getElementById('wordListItemsContainer');
  container.innerHTML = '';

  const allWords = getAllWords();
  const list = allWords.filter((item, index) => {
    if (listLevelFilter !== 'all') {
      if (listLevelFilter === 'extra') {
        if (!item[0].startsWith('extra_')) return false;
      } else if (listLevelFilter === 'idiom') {
        if (!item[0].startsWith('idiom_') && item[0] !== 'idiom') return false;
      } else if (listLevelFilter === 'custom') {
        if (!item[0].startsWith('custom')) return false;
      } else if (item[0] !== listLevelFilter) {
        return false;
      }
    }

    const wData = getWordData(item[1]);
    if (listStatusFilter === 'unlearned' && wData.learned) return false;
    if (listStatusFilter === 'learned' && !wData.learned) return false;
    if (listStatusFilter === 'mistakes' && (!wData.mistakes || wData.mistakes === 0)) return false;
    if (listStatusFilter === 'bookmarked' && !wData.bookmarked) return false;

    if (query) {
      const matchW = item[1].toLowerCase().includes(query);
      const matchM = item[2].includes(query);
      if (!matchW && !matchM) return false;
    }
    return true;
  });

  document.getElementById('listResultCount').innerText = `表示件数: ${list.length} / ${allWords.length} 件`;
  document.getElementById('searchClearBtn').classList.toggle('hidden', !query);

  if (list.length === 0) {
    container.innerHTML = '<div class="text-center py-10 text-slate-500 text-sm">該当する単語が見つかりませんでした。</div>';
    return;
  }

  list.forEach(item => {
    const wData = getWordData(item[1]);
    const isCustom = item[0].startsWith('custom') || Boolean(item[3]);
    const div = document.createElement('div');
    div.className = `p-3 rounded-2xl border transition-all flex items-center justify-between gap-3 ${
      wData.learned ? 'bg-emerald-950/20 border-emerald-900/60' : 'bg-slate-800/60 border-slate-700/70 hover:border-slate-600'
    }`;

    div.innerHTML = `
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-black text-white text-base sm:text-lg tracking-tight">${item[1]}</span>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-300">${getCategoryShortLabel(item[0])}</span>
          ${wData.mistakes > 0 ? `<span class="text-[10px] font-bold bg-rose-500/20 border border-rose-500/30 text-rose-300 px-1.5 py-0.5 rounded">ミス: ${wData.mistakes}回</span>` : ''}
          ${isCustom ? `<span class="text-[10px] font-bold bg-amber-500/20 border border-amber-500/30 text-amber-300 px-1.5 py-0.5 rounded">自作</span>` : ''}
        </div>
        <p class="text-xs sm:text-sm text-slate-300 mt-1 leading-snug">${item[2]}</p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        ${isCustom ? `<button onclick="openAddWordModal('${item[3] || item[1]}')" class="p-2 rounded-xl text-slate-400 hover:text-emerald-400 hover:bg-slate-700 cursor-pointer" title="自作単語を編集">✏️</button>` : ''}
        <button onclick="toggleListBookmark('${item[1]}')" class="p-2 rounded-xl text-slate-400 hover:text-amber-400 cursor-pointer">
          ${wData.bookmarked ? '⭐' : '☆'}
        </button>
        <button onclick="speakWord('${item[1]}')" class="p-2 rounded-xl text-slate-400 hover:text-amber-400 hover:bg-slate-700 cursor-pointer" title="発音を聞く">🔊</button>
        <button onclick="toggleListLearned('${item[1]}')" class="text-xs font-black px-3 py-1.5 rounded-xl border transition-all cursor-pointer ${
          wData.learned ? 'bg-emerald-600 text-white border-emerald-500 shadow-sm' : 'bg-slate-700/80 text-slate-300 border-slate-600 hover:bg-slate-700'
        }">
          ${wData.learned ? '習得済' : '覚えた'}
        </button>
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleListBookmark(word) {
  const wData = getWordData(word);
  wData.bookmarked = !wData.bookmarked;
  saveUserStats();
  renderWordList();
  showToast(wData.bookmarked ? `「${word}」をブックマークしました ⭐` : `「${word}」のブックマークを解除しました`);

// 6. ANALYTICS LOGIC
function renderAnalytics() {
  const allWords = getAllWords();
  const calcLevel = filterFn => {
    const list = allWords.filter(item => filterFn(item[0]));
    const total = list.length;
    const learned = list.filter(item => getWordData(item[1]).learned).length;
    const pct = total > 0 ? Math.round((learned / total) * 100) : 0;
    return { total, learned, pct };
  };

  const s600 = calcLevel(l => l === '600');
  const s730 = calcLevel(l => l === '730');
  const s860 = calcLevel(l => l === '860');
  const s990 = calcLevel(l => l === '990');
  const sExtra = calcLevel(l => l.startsWith('extra_'));
  const sIdiom = calcLevel(l => l.startsWith('idiom_') || l === 'idiom');
  const sCustom = {
    total: customWords.length,
    learned: customWords.filter(item => getWordData(item[1]).learned).length,
    pct: customWords.length > 0 ? Math.round((customWords.filter(item => getWordData(item[1]).learned).length / customWords.length) * 100) : 0
  };

  const totalAll = allWords.length;
  const learnedAll = allWords.filter(item => getWordData(item[1]).learned).length;
  const mistakesAll = allWords.filter(item => (getWordData(item[1]).mistakes || 0) > 0).length;
  const bookmarkedAll = allWords.filter(item => getWordData(item[1]).bookmarked).length;
  const overallPct = totalAll > 0 ? Math.round((learnedAll / totalAll) * 100) : 0;

  document.getElementById('statOverallPct').innerText = `${overallPct}%`;
  document.getElementById('statLearnedRatio').innerText = `${learnedAll} / ${totalAll}語`;

  const streakData = getStreakData();
  document.getElementById('statTodayCount').innerText = streakData.todayCount || 0;
  document.getElementById('statStreakDays').innerText = `継続ストリーク: ${streakData.streak}日`;
  document.getElementById('statMistakesTotal').innerText = mistakesAll;
  document.getElementById('statBookmarksTotal').innerText = bookmarkedAll;

  // Prediction
  let pred = '600点 レベル到達見込み ✨';
  if (s600.pct >= 85 && s730.pct >= 80 && s860.pct >= 75 && s990.pct >= 70) {
    pred = '900点〜990点 満点射程圏内 🔥';
  } else if (s600.pct >= 85 && s730.pct >= 80 && s860.pct >= 70) {
    pred = '860点 レベル到達見込み 🚀';
  } else if (s600.pct >= 80 && s730.pct >= 70) {
    pred = '730点 レベル到達見込み 🎯';
  }
  document.getElementById('statScorePredictionText').innerText = pred;

  // Progress Bars
  const barsContainer = document.getElementById('analyticsBarsContainer');
  const levels = [
    { label: '600点 レベル (400語)', stats: s600, color: 'from-emerald-500 to-teal-400' },
    { label: '730点 レベル (300語)', stats: s730, color: 'from-sky-500 to-cyan-400' },
    { label: '860点 レベル (200語)', stats: s860, color: 'from-amber-500 to-yellow-400' },
    { label: '990点 レベル (100語)', stats: s990, color: 'from-rose-500 to-pink-400' },
    { label: '必須イディオム・熟語 (200項目)', stats: sIdiom, color: 'from-fuchsia-500 to-purple-400' },
    { label: '重要付録 (134項目)', stats: sExtra, color: 'from-indigo-500 to-blue-400' },
    { label: `マイトレーニング (${customWords.length}語)`, stats: sCustom, color: 'from-emerald-400 to-lime-400' }
  ];

  barsContainer.innerHTML = levels
    .map(
      lvl => `
    <div class="space-y-1">
      <div class="flex items-center justify-between text-xs font-bold">
        <span class="text-slate-300">${lvl.label}</span>
        <span class="text-white font-mono">${lvl.stats.learned} / ${lvl.stats.total} (${lvl.stats.pct}%)</span>
      </div>
      <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700/50">
        <div class="bg-gradient-to-r ${lvl.color} h-full transition-all duration-500" style="width: ${lvl.stats.pct}%"></div>
      </div>
    </div>
  `
    )
    .join('');

  // Weakest 10 words
  const weakWords = allWords.filter(item => (getWordData(item[1]).mistakes || 0) > 0)
    .sort((a, b) => (getWordData(b[1]).mistakes || 0) - (getWordData(a[1]).mistakes || 0))
    .slice(0, 10);

  const weakContainer = document.getElementById('analyticsWeakList');
  weakContainer.innerHTML = '';
  if (weakWords.length === 0) {
    document.getElementById('analyticsWeakestBox').classList.add('hidden');
  } else {
    document.getElementById('analyticsWeakestBox').classList.remove('hidden');
    weakWords.forEach((item, i) => {
      const wData = getWordData(item[1]);
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-rose-900/40';
      row.innerHTML = `
        <div class="min-w-0 pr-2">
          <span class="font-mono text-slate-500 mr-1">#${i + 1}</span>
          <span class="font-extrabold text-white mr-2">${item[1]}</span>
          <span class="text-slate-400 truncate block text-[11px]">${item[2]}</span>
        </div>
        <span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 text-[10px] font-black px-2 py-0.5 rounded-md shrink-0">
          ${wData.mistakes}回ミス
        </span>
      `;
      weakContainer.appendChild(row);
    });
  }
}

// Navigation & Tab Switching
function switchTab(tabId) {
  currentTab = tabId;
  ['card', 'quiz', 'spell', 'speed', 'list', 'analytics'].forEach(t => {
    const view = document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`);
    const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
    if (t === tabId) {
      view.classList.remove('hidden');
      btn.className = 'flex-1 min-w-[72px] py-2 rounded-lg text-center transition-all bg-amber-500 text-slate-950 font-black shadow-md flex items-center justify-center gap-1 cursor-pointer';
    } else {
      view.classList.add('hidden');
      btn.className = 'flex-1 min-w-[72px] py-2 rounded-lg text-center transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1 cursor-pointer';
    }
  });

  const subFilter = document.getElementById('subFilterRow');
  const subBar = document.getElementById('subProgressBarRow');
  if (tabId === 'analytics') {
    subFilter.classList.add('hidden');
    subBar.classList.add('hidden');
  } else {
    subFilter.classList.remove('hidden');
    subBar.classList.remove('hidden');
  }

  if (tabId === 'card') renderCurrentCard();
  if (tabId === 'spell') renderCurrentSpell();
  if (tabId === 'quiz') resetQuizScreen();
  if (tabId === 'list') renderWordList();
  if (tabId === 'analytics') renderAnalytics();
}

function handleLevelChange() {
  currentLevel = document.getElementById('levelSelect').value;
  populatePartOptions();
  refreshQueue();
}

function handlePartChange() {
  currentPart = document.getElementById('partSelect').value;
  currentCardIndex = 0;
  refreshQueue();
}

function populatePartOptions() {
  const partSelect = document.getElementById('partSelect');
  partSelect.innerHTML = '';
  const parts = getPartsForLevel(currentLevel);

  parts.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.label;
    partSelect.appendChild(opt);
  });
  currentPart = parts.length > 0 ? parts[0].id : '0';
}

function advanceToNextSection() {
  const parts = getPartsForLevel(currentLevel);
  const currentIndex = parts.findIndex(p => p.id === currentPart);
  if (currentIndex !== -1 && currentIndex + 1 < parts.length - 1) {
    currentPart = parts[currentIndex + 1].id;
    document.getElementById('partSelect').value = currentPart;
    refreshQueue();
    showToast('次のPartへ進みました 🚀');
  } else {
    showToast('このレベルの全Partを修了しました！おめでとうございます！🎉');
  }
}

// Add / Edit Custom Word Modal Logic
let currentEditCustomId = null;

function openAddWordModal(editId = null) {
  currentEditCustomId = editId;
  const modal = document.getElementById('addWordModal');
  const title = document.getElementById('addWordModalTitle');
  const icon = document.getElementById('addWordModalIcon');
  const wordInp = document.getElementById('customWordInput');
  const meanInp = document.getElementById('customMeaningInput');
  const deleteBtn = document.getElementById('btnDeleteCustomWord');

  if (editId) {
    const existing = customWords.find(w => w[3] === editId || w[1] === editId);
    if (existing) {
      title.innerText = '自作単語・熟語の編集';
      icon.innerText = '✏️';
      wordInp.value = existing[1];
      meanInp.value = existing[2];
      const tag = existing[0].replace('custom_', '') || 'custom';
      selectCustomTag(tag);
      deleteBtn.classList.remove('hidden');
    }
  } else {
    title.innerText = '自作単語・熟語の登録';
    icon.innerText = '➕';
    wordInp.value = '';
    meanInp.value = '';
    selectCustomTag('custom');
    deleteBtn.classList.add('hidden');
  }

  modal.classList.remove('hidden');
  setTimeout(() => wordInp.focus(), 100);
}

function closeAddWordModal() {
  document.getElementById('addWordModal').classList.add('hidden');
  currentEditCustomId = null;
}

function selectCustomTag(tag) {
  document.getElementById('customSelectedTag').value = tag;
  const btns = document.querySelectorAll('.custom-tag-btn');
  btns.forEach(btn => {
    if (btn.getAttribute('data-tag') === tag) {
      btn.className = 'custom-tag-btn px-2.5 py-1.5 rounded-lg border text-xs font-bold cursor-pointer bg-amber-500 text-slate-950 border-amber-400';
    } else {
      btn.className = 'custom-tag-btn px-2.5 py-1.5 rounded-lg border text-xs font-bold cursor-pointer bg-slate-800 text-slate-400 border-slate-700 hover:text-white';
    }
  });
}

function saveCustomWordModal() {
  const wordInp = (document.getElementById('customWordInput').value || '').trim();
  const meanInp = (document.getElementById('customMeaningInput').value || '').trim();
  const tag = document.getElementById('customSelectedTag').value || 'custom';

  if (!wordInp) {
    showToast('英単語・フレーズを入力してください');
    return;
  }
  if (!meanInp) {
    showToast('日本語の意味・訳語を入力してください');
    return;
  }

  const category = tag === 'custom' ? 'custom' : `custom_${tag}`;

  if (currentEditCustomId) {
    const idx = customWords.findIndex(w => w[3] === currentEditCustomId || w[1] === currentEditCustomId);
    if (idx !== -1) {
      const oldWord = customWords[idx][1];
      customWords[idx] = [category, wordInp, meanInp, currentEditCustomId, true];
      if (oldWord !== wordInp && userStats[oldWord]) {
        userStats[wordInp] = { ...userStats[oldWord] };
        delete userStats[oldWord];
        saveUserStats();
      }
      showToast(`「${wordInp}」を更新しました ✨`);
    }
  } else {
    const newId = 'custom_' + Date.now();
    customWords.push([category, wordInp, meanInp, newId, true]);
    showToast(`「${wordInp}」を単語帳に追加しました 🎉`);
  }

  saveCustomWords();
  closeAddWordModal();
  if (currentLevel === 'custom') {
    populatePartOptions();
  }
  refreshQueue();
  if (currentTab === 'list') renderWordList();
}

function deleteCurrentCustomWord() {
  if (!currentEditCustomId) return;
  const idx = customWords.findIndex(w => w[3] === currentEditCustomId || w[1] === currentEditCustomId);
  if (idx !== -1) {
    const removedWord = customWords[idx][1];
    customWords.splice(idx, 1);
    saveCustomWords();
    closeAddWordModal();
    if (currentLevel === 'custom') populatePartOptions();
    refreshQueue();
    if (currentTab === 'list') renderWordList();
    showToast(`「${removedWord}」を削除しました`);
  }
}

// Backup & Transfer
function openBackupModal() {
  document.getElementById('backupModal').classList.remove('hidden');
}

function closeBackupModal() {
  document.getElementById('backupModal').classList.add('hidden');
}

function copyTransferCode() {
  try {
    const payload = {
      version: 'kinfre-v5',
      timestamp: new Date().toISOString(),
      stats: userStats,
      customWords: customWords
    };
    const jsonStr = JSON.stringify(payload);
    const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
    navigator.clipboard.writeText(encoded);
    showToast('引き継ぎコードをクリップボードにコピーしました！📋');
  } catch {
    showToast('コードのコピーに失敗しました');
  }
}

function restoreFromTransferCode() {
  const input = document.getElementById('transferCodeInput').value.trim();
  if (!input) {
    showToast('復元コードを入力してください');
    return;
  }
  try {
    const jsonStr = decodeURIComponent(escape(atob(input)));
    const data = JSON.parse(jsonStr);
    if (data && data.stats) {
      userStats = data.stats;
      saveUserStats();
      if (Array.isArray(data.customWords)) {
        customWords = data.customWords;
        saveCustomWords();
      }
      refreshQueue();
      showToast('学習データと自作単語を完全に復元しました！🎉');
      document.getElementById('transferCodeInput').value = '';
      closeBackupModal();
    } else {
      showToast('無効な復元コードです');
    }
  } catch {
    showToast('コードの解析に失敗しました。正しいコードか確認してください');
  }
}

function exportBackupJson() {
  const payload = {
    version: 'kinfre-v5',
    date: new Date().toLocaleDateString('ja-JP'),
    stats: userStats,
    customWords: customWords
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `TOEIC_Kinfre_Backup_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('バックアップJSONを書き出しました 💾');
}

function importBackupJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && parsed.stats) {
        userStats = parsed.stats;
        saveUserStats();
        if (Array.isArray(parsed.customWords)) {
          customWords = parsed.customWords;
          saveCustomWords();
        }
        refreshQueue();
        showToast('JSONファイルからデータと自作単語を復元しました！');
        closeBackupModal();
      } else {
        showToast('正しいバックアップファイルではありません');
      }
    } catch {
      showToast('ファイルの読み込みに失敗しました');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// Confirmation Modal (No window.alert/confirm)
let modalCallback = null;
function openModal(title, msg, callback) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalMessage').innerText = msg;
  modalCallback = callback;
  document.getElementById('customModal').classList.remove('hidden');
}

function closeModal(result) {
  document.getElementById('customModal').classList.add('hidden');
  if (modalCallback) {
    modalCallback(result);
    modalCallback = null;
  }
}

function confirmResetSectionModal() {
  openModal(
    'セクションの未習得復帰',
    'このセクションの単語をすべて未習得に戻してもう一度学習しますか？（※ミス回数やブックマークの記録は保持されます）',
    confirmed => {
      if (confirmed) resetSectionStatus();
    }
  );
}

function resetSectionStatus() {
  const list = getBaseSectionList();
  list.forEach(item => {
    if (userStats[item[1]]) {
      userStats[item[1]].learned = false;
      // IMPORTANT: wData.mistakes and wData.bookmarked are 100% PRESERVED!
    }
  });
  saveUserStats();
  currentCardIndex = 0;
  currentQueueFilter = 'unlearned';
  refreshQueue();
  showToast('セクションを未習得に戻しました（ミス記録は保持）🔄');
}

function confirmResetAllData() {
  openModal(
    '全データの初期化',
    '全1,134単語の学習進捗、ミス回数、ブックマークを完全に初期化します。よろしいですか？',
    confirmed => {
      if (confirmed) {
        userStats = {};
        saveUserStats();
        currentCardIndex = 0;
        cardActionHistory = [];
        updateUndoButtonState();
        refreshQueue();
        closeBackupModal();
        showToast('全データを初期化しました');
      }
    }
  );
}

// Toast
let toastTimeout = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toastText').innerText = msg;
  toast.style.opacity = '1';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.style.opacity = '0';
  }, 2300);
}

// Keyboard Shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
    if (e.target.id === 'spellInput' && e.key === 'Enter') {
      e.preventDefault();
      checkSpelling();
    }
    return;
  }

  if (currentTab === 'card') {
    if (e.code === 'Space') {
      e.preventDefault();
      toggleCardFlip();
    } else if (e.code === 'ArrowRight' || e.key === 'j') {
      e.preventDefault();
      navigateCard(1);
    } else if (e.code === 'ArrowLeft' || e.key === 'k') {
      e.preventDefault();
      navigateCard(-1);
    } else if (e.key === '1') {
      e.preventDefault();
      handleMarkCard(false);
    } else if (e.key === '2') {
      e.preventDefault();
      playCurrentAudio();
    } else if (e.key === '3') {
      e.preventDefault();
      handleMarkCard(true);
    } else if (e.key === 'z' || (e.ctrlKey && e.key === 'z') || e.key === 'u') {
      e.preventDefault();
      handleUndoLastAction();
    }
  } else if (currentTab === 'speed' && speedPlaying) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === '1') {
      e.preventDefault();
      handleSpeedAnswer(false);
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === '2') {
      e.preventDefault();
      handleSpeedAnswer(true);
    }
  }
});

// Touch Swipe on Flashcard
let touchStartX = 0;
let touchEndX = 0;
window.addEventListener('DOMContentLoaded', () => {
  const cardEl = document.getElementById('cardInner');
  if (cardEl) {
    cardEl.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    cardEl.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 60) {
        if (diff < 0) navigateCard(1);
        else navigateCard(-1);
      }
    }, { passive: true });
  }

  populatePartOptions();
  updateStreakUI();
  refreshQueue();
});
